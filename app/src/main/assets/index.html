:root{
  color-scheme:dark;
  --bg:#0c0c0e;
  --surface:#161618;
  --raised:#222226;
  --raised-2:#2c2c31;
  --line:rgba(255,255,255,.1);
  --text:#f5f5f7;
  --muted:#a7a7b0;
  --faint:#75757e;
  --h:141; --s:73; --l:50;
  --acc:hsl(var(--h) calc(var(--s) * 1%) calc(var(--l) * 1%));
  --on-acc:#04140a;
  --sb-bg:#000;
  --dock-bg:#18181a;
  --tab-bg:#0c0c0e;
  --pop-bg:#26262a;
  --blur:0px;
  --edge:rgba(255,255,255,.08);
  --card:rgba(255,255,255,.05);
  --card-hover:rgba(255,255,255,.1);
  --font:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans Arabic","Noto Sans",sans-serif;
  --sidebar:248px;
  --tab:64px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --dock:0px;
}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text);font:500 15px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.lock{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.fillicon{fill:currentColor;stroke:none}
svg.i.solid{fill:currentColor}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ambient colour that follows the current song */
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none}
.ambient i{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease}
.ambient i.on{opacity:1}

.shell{position:relative;z-index:1;display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);min-height:100dvh}

/* sidebar */
.sidebar{position:sticky;top:0;height:100dvh;padding:22px 14px 16px;display:flex;flex-direction:column;gap:20px;border-right:1px solid var(--line);background:rgba(8,14,21,.62);backdrop-filter:blur(20px);overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px;font-weight:800;font-size:25px;letter-spacing:-.045em}
.logo{width:36px;height:36px;flex:none;border-radius:11px;box-shadow:0 6px 20px rgba(30,215,96,.3)}
.mobile-head{display:none;align-items:center;gap:10px;margin:0 0 16px}
.mobile-head .wordmark{font-weight:800;font-size:24px;letter-spacing:-.045em}
.brand-mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--acc);color:var(--on-acc);transition:background .6s}
.brand-mark svg{width:20px;height:20px;stroke-width:2.6}
.nav{display:flex;flex-direction:column;gap:3px}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:11px;color:var(--muted);font-weight:650;text-align:left;transition:background .15s,color .15s}
.nav-item:hover{background:rgba(255,255,255,.055);color:var(--text)}
.nav-item[aria-current=page]{background:rgba(255,255,255,.09);color:var(--text)}
.nav-item[aria-current=page] svg{color:var(--acc)}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 12px;color:var(--muted);font-size:13px;font-weight:700}
.side-pl{display:flex;flex-direction:column;gap:2px;overflow-y:auto;min-height:0;flex:1}
.side-pl .nav-item{padding:8px 12px;font-weight:600;font-size:14px}
.side-pl .nav-item .trunc{flex:1}
.side-empty{padding:6px 12px;color:var(--faint);font-size:13px}
.side-foot{margin-top:auto}

/* main */
.main{--pad:clamp(16px,3.6vw,46px);min-width:0;width:100%;max-width:1180px;margin:0 auto;padding:20px clamp(16px,3.6vw,46px) calc(var(--dock) + 36px)}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.searchbar{flex:1;max-width:460px;display:flex;align-items:center;gap:10px;height:46px;padding:0 16px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--muted);transition:background .15s,border-color .15s}
.searchbar:focus-within{background:rgba(255,255,255,.09);border-color:color-mix(in srgb,var(--acc) 55%,transparent)}
.searchbar input{flex:1;min-width:0;height:100%;background:none;border:0;outline:none;color:var(--text)}
.searchbar input::placeholder{color:var(--faint)}
.searchbar .clear{display:none;width:28px;height:28px;border-radius:50%;place-items:center;color:var(--muted)}
.searchbar.has-text .clear{display:grid}
.searchbar .clear:hover{background:rgba(255,255,255,.1);color:var(--text)}
.searchbar svg{width:18px;height:18px}
.searchbar input[type=search]{-webkit-appearance:none;appearance:none}
.searchbar input[type=search]::-webkit-search-cancel-button,.searchbar input[type=search]::-webkit-search-decoration{-webkit-appearance:none;display:none}
.topbar .spacer{flex:1}

/* buttons */
.btn{height:42px;padding:0 18px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:750;font-size:14px;background:rgba(255,255,255,.085);color:var(--text);white-space:nowrap;transition:background .15s,transform .1s,filter .15s}
.btn:hover{background:rgba(255,255,255,.14)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--acc);color:var(--on-acc)}
.btn.primary:hover{filter:brightness(1.07);background:var(--acc)}
.btn.danger{background:#d9534f;color:#fff}
.btn.danger:hover{background:#e4605c}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn svg{width:18px;height:18px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none;transition:color .15s,background .15s,transform .1s}
.icon-btn:hover{color:var(--text);background:rgba(255,255,255,.08)}
.icon-btn:active{transform:scale(.92)}
.icon-btn[aria-pressed=true]{color:var(--acc)}
.icon-btn.liked{color:var(--acc)}
.icon-btn.liked svg{fill:currentColor}
.link-btn{color:var(--muted);font-weight:650;font-size:13px;padding:6px 8px;border-radius:8px}
.link-btn:hover{color:var(--text)}

/* cover art */
.art{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;display:grid;place-items:center;flex:none;background:var(--raised)}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.art.gen{background:repeating-radial-gradient(circle at 22% 128%,rgba(255,255,255,.11) 0 2px,transparent 2px 15px),linear-gradient(140deg,var(--a1),var(--a2))}
.art svg{width:42%;height:42%;color:rgba(255,255,255,.72);stroke-width:1.5}
.art.mosaic{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.art.mosaic .art{border-radius:0;width:100%}
.art.mosaic .art svg{width:46%;height:46%}

/* page headings */
.page-head{margin:0 0 26px}
.page-head h1,.col-meta h1{font-size:clamp(30px,4.6vw,46px);font-weight:800;letter-spacing:-.04em;line-height:1.06;overflow-wrap:anywhere}
.page-head .sub{margin-top:8px;color:var(--muted)}
.sec{margin-bottom:38px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px}
.sec-head h2{font-size:19px;font-weight:750;letter-spacing:-.02em}
.sec-tools{display:flex;align-items:center;gap:8px}
.sort{height:34px;padding:0 10px;border-radius:10px;background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--muted);font-size:13px;font-weight:650}
.sort option{background:var(--raised);color:var(--text)}

/* hero */
.hero{display:flex;gap:26px;align-items:center;padding:20px;margin-bottom:38px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(120deg,color-mix(in srgb,var(--hero) 30%,var(--surface)),var(--surface) 72%)}
.hero .art{width:clamp(108px,16vw,172px);border-radius:15px;box-shadow:0 18px 44px rgba(0,0,0,.38)}
.hero-text{min-width:0}
.hero-text .kicker{color:var(--muted);font-size:13.5px;font-weight:650;margin-bottom:6px}
.hero-text h2{font-size:clamp(22px,3.2vw,32px);font-weight:800;letter-spacing:-.035em;line-height:1.1;overflow-wrap:anywhere}
.hero-text .by{color:var(--muted);margin-top:4px}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}

/* welcome (empty library) */
.welcome{display:grid;place-items:center;text-align:center;padding:clamp(36px,9vw,84px) 20px;border:1px dashed color-mix(in srgb,var(--acc) 35%,var(--line));border-radius:26px;background:rgba(255,255,255,.025)}
.welcome .bars{display:flex;align-items:center;gap:6px;height:64px;margin-bottom:22px}
.welcome .bars i{width:8px;border-radius:5px;background:var(--acc);animation:wv 1.6s ease-in-out infinite}
.welcome .bars i:nth-child(1){height:28px}.welcome .bars i:nth-child(2){height:54px;animation-delay:-.3s}.welcome .bars i:nth-child(3){height:40px;animation-delay:-.6s}.welcome .bars i:nth-child(4){height:62px;animation-delay:-.9s}.welcome .bars i:nth-child(5){height:34px;animation-delay:-1.2s}
@keyframes wv{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
.welcome h2{font-size:clamp(24px,4vw,34px);font-weight:800;letter-spacing:-.035em}
.welcome p{color:var(--muted);max-width:420px;margin:10px auto 24px}
.empty{border:1px dashed var(--line);border-radius:18px;padding:34px 22px;text-align:center;color:var(--muted)}
.empty h3{color:var(--text);font-size:18px;font-weight:750;margin-bottom:6px}
.empty .btn{margin-top:18px}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:14px}
.card{display:block;width:100%;padding:10px;border-radius:16px;text-align:left;transition:background .15s}
.card:hover{background:rgba(255,255,255,.06)}
.card .art{width:100%;margin-bottom:10px;border-radius:12px}
.card .c-title{font-weight:700;font-size:14.5px}
.card .c-sub{color:var(--muted);font-size:13px}
.card.new .art{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.card.new .art svg{width:32%;height:32%;color:var(--muted)}
.card.new:hover .art{border-color:var(--acc)}
.rail{display:flex;gap:12px;overflow-x:auto;padding:0 2px 8px;margin:0 -2px;scroll-snap-type:x proximity}
.rail .card{flex:0 0 150px;scroll-snap-align:start;padding:0 0 10px;background:none}
.rail .card:hover .art{filter:brightness(1.1)}
.rail .card .c-title,.rail .card .c-sub{padding-right:4px}

/* collection header */
.col-head{display:flex;gap:26px;align-items:flex-end;margin-bottom:26px}
.col-head>.art{width:clamp(112px,20vw,196px);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.col-meta{min-width:0}
.col-meta .sub{color:var(--muted);margin-top:8px}
.col-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}

/* track list */
.tracks{--cols:40px minmax(0,2fr) minmax(0,1.2fr) 56px 40px 40px;display:flex;flex-direction:column}
.t-head{display:grid;grid-template-columns:var(--cols);gap:8px;align-items:center;padding:0 12px 8px 8px;margin-bottom:6px;border-bottom:1px solid var(--line);color:var(--faint);font-size:12.5px;font-weight:700}
.t-head span:first-child{text-align:center}
.t-head span:nth-child(4){text-align:right}
.track{display:grid;grid-template-columns:var(--cols);gap:8px;align-items:center;padding:6px 12px 6px 8px;border-radius:12px;color:var(--muted);transition:background .12s}
.track:hover,.track:focus-visible{background:rgba(255,255,255,.055)}
.track:focus-visible{outline-offset:-2px}
.track.is-current{background:color-mix(in srgb,var(--acc) 11%,transparent)}
.t-idx{display:grid;place-items:center;height:36px;font-size:13px;font-variant-numeric:tabular-nums}
.t-idx>*{grid-area:1/1}
.t-idx .eq,.t-idx .t-play{display:none}
.t-play{width:32px;height:32px;border-radius:50%;place-items:center;color:var(--text)}
.t-play .i-pause{display:none}
.track.is-current .num{color:var(--acc);font-weight:700}
.t-main{display:flex;align-items:center;gap:12px;min-width:0}
.t-main .art{width:44px;border-radius:8px}
.t-text{min-width:0}
.t-title{color:var(--text);font-weight:650;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track.is-current .t-title{color:var(--acc)}
.t-artist{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-album{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-time{font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.track .icon-btn{width:36px;height:36px}
.track .icon-btn svg{width:19px;height:19px}
@media(hover:hover){
  .track:hover .num{display:none}
  .track:hover .t-play{display:grid}
  .track:hover .eq{display:none!important}
  .track .more,.track .like:not(.liked){opacity:0}
  .track:hover .more,.track:hover .like,.track:focus-within .more,.track:focus-within .like{opacity:1}
}
body.playing .track.is-current .num{display:none}
body.playing .track.is-current .eq{display:flex}
body.playing .track.is-current .t-play .i-play{display:none}
body.playing .track.is-current .t-play .i-pause{display:block}
.eq{display:none;align-items:flex-end;gap:2px;height:14px}
.eq i{width:3px;height:100%;border-radius:2px;background:var(--acc);transform-origin:bottom;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.4s}.eq i:nth-child(3){animation-delay:-.75s}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@media(max-width:760px){
  .tracks{--cols:30px minmax(0,1fr) 38px 38px}
  .t-album,.t-time,.t-head{display:none}
}

/* player dock */
.dock{position:fixed;z-index:20;left:calc(var(--sidebar) + 16px);right:16px;bottom:16px;display:grid;grid-template-columns:minmax(190px,1fr) minmax(280px,1.5fr) minmax(150px,1fr);align-items:center;gap:20px;padding:12px 16px;border-radius:22px;background:rgba(19,30,42,.8);backdrop-filter:blur(26px) saturate(1.35);border:1px solid var(--line);box-shadow:0 18px 54px rgba(0,0,0,.5)}
.dock-progress{display:none}
.now{display:flex;align-items:center;gap:12px;min-width:0}
.now-open{display:flex;align-items:center;gap:12px;min-width:0;text-align:left;border-radius:12px;flex:1}
.now .art{width:56px;border-radius:11px}
.now-meta{min-width:0;display:block}
.now-meta .t{display:block;font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.now-meta .a{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock-center{display:flex;flex-direction:column;gap:4px;min-width:0}
.controls{display:flex;align-items:center;justify-content:center;gap:8px}
.play-btn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--text);color:#0b121a;flex:none;transition:transform .12s}
.play-btn:hover{transform:scale(1.07)}
.play-btn:active{transform:scale(.95)}
.play-btn svg{width:22px;height:22px}
.seek-row{display:grid;grid-template-columns:42px minmax(0,1fr) 42px;align-items:center;gap:10px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.seek-row span:first-child{text-align:right}
.dock-right{display:flex;align-items:center;justify-content:flex-end;gap:4px}
.dock-right .vol{width:100px}

/* sliders */
input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:22px;margin:0;background:transparent;cursor:pointer;--p:0%;touch-action:none}
input[type=range]:focus-visible{outline-offset:0;border-radius:6px}
input[type=range]{--fill:var(--text)}
input[type=range]:hover,input[type=range].dragging,input[type=range]:focus-visible{--fill:var(--acc)}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:99px;background:linear-gradient(to right,var(--fill) var(--p),rgba(255,255,255,.2) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;margin-top:-4px;border-radius:50%;background:#fff;border:0;transform:scale(0);transition:transform .12s;box-shadow:0 1px 6px rgba(0,0,0,.5)}
input[type=range]::-moz-range-track{height:5px;border-radius:99px;background:rgba(255,255,255,.17)}
input[type=range]::-moz-range-progress{height:5px;border-radius:99px;background:var(--fill)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:#fff;transform:scale(0);transition:transform .12s}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:focus-visible::-webkit-slider-thumb,input[type=range].dragging::-webkit-slider-thumb{transform:scale(1)}
input[type=range]:hover::-moz-range-thumb,input[type=range]:focus-visible::-moz-range-thumb,input[type=range].dragging::-moz-range-thumb{transform:scale(1)}
@media(hover:none){
  input[type=range]::-webkit-slider-thumb{transform:scale(1)}
  input[type=range]::-moz-range-thumb{transform:scale(1)}
}

/* tab bar (small screens) */
.tabbar{display:none;position:fixed;z-index:25;left:0;right:0;bottom:0;height:calc(var(--tab) + var(--safe-b));padding-bottom:var(--safe-b);grid-template-columns:repeat(4,1fr);background:rgba(9,15,22,.9);backdrop-filter:blur(22px);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:650;color:var(--muted)}
.tab[aria-current=page]{color:var(--text)}
.tab[aria-current=page] svg{color:var(--acc)}

/* now playing */
.np{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:var(--bg);transform:translateY(100%);visibility:hidden;will-change:transform;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .3s,visibility 0s linear .5s}
.np.open{transform:none;visibility:visible;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .3s}
.np-glow{position:absolute;inset:0;pointer-events:none}
.np-top{position:relative;display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 4px}
.np-top .label{font-weight:700;color:var(--muted);font-size:14px}
.np-scroll{position:relative;flex:1;overflow-y:auto;padding:8px clamp(18px,5vw,64px) calc(32px + var(--safe-b))}
.np-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,6vw,84px);max-width:1180px;margin:0 auto;align-items:start}
.np-art-col{display:flex;flex-direction:column;align-items:center;gap:20px;padding-top:6px}
.np-art{width:min(100%,460px)}
.np-art .art{border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.55);transform:scale(.93);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
body.playing .np-art .art{transform:none}
.np-viz{width:min(100%,460px);height:52px;display:block}
.np-side{display:flex;flex-direction:column;gap:6px;min-width:0;padding-top:6px}
.np-info{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
.np-info h2{font-size:clamp(24px,3.4vw,36px);font-weight:800;letter-spacing:-.035em;line-height:1.1;overflow-wrap:anywhere}
.np-info p{color:var(--muted);margin-top:4px;font-size:16px}
.np-seek{margin-top:14px}
.np-controls{display:flex;align-items:center;justify-content:center;gap:16px;margin:12px 0 2px}
.np-controls .play-btn{width:66px;height:66px}
.np-controls .play-btn svg{width:28px;height:28px}
.np-controls .icon-btn{width:46px;height:46px}
.np-vol{display:flex;align-items:center;gap:10px;margin-top:8px;color:var(--muted)}
.np-vol .vol{flex:1}
.queue{margin-top:22px}
.queue h3{font-size:16px;font-weight:750;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
.queue h3 span{color:var(--muted);font-size:13px;font-weight:600}
.q-row{display:flex;align-items:center;gap:12px;width:100%;padding:6px 8px;border-radius:12px;text-align:left}
.q-row:hover{background:rgba(255,255,255,.06)}
.q-row .art{width:42px;border-radius:8px}
.q-row .t-title{font-size:14px}
.q-more,.q-none{color:var(--muted);font-size:13px;padding:8px}
@media(max-width:860px){
  .np-body{grid-template-columns:1fr}
  .np-art{width:min(78vw,380px)}
  .np-viz{width:min(78vw,380px)}
}

/* dialogs */
dialog{border:1px solid var(--line);border-radius:22px;background:var(--surface);color:var(--text);padding:0;width:min(440px,calc(100vw - 28px));max-height:min(84dvh,680px);box-shadow:0 30px 100px rgba(0,0,0,.65);overflow:hidden}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:rgba(3,8,12,.68);backdrop-filter:blur(4px)}
dialog>.dlg{flex:1 1 auto;min-height:0}
dialog.wide{width:min(540px,calc(100vw - 28px))}
.dlg{padding:24px;display:flex;flex-direction:column;min-height:0}
.dlg h3{font-size:21px;font-weight:800;letter-spacing:-.03em}
.dlg p{color:var(--muted);font-size:14px;margin:6px 0 16px}
.dlg input[type=text]{width:100%;height:48px;padding:0 16px;border-radius:13px;background:var(--bg);border:1px solid var(--line);outline:none}
.dlg input[type=text]:focus{border-color:var(--acc)}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.pick-tools{display:flex;gap:8px;margin:2px 0 12px}
.pick-tools .searchbar{max-width:none;height:42px}
.pick-list{flex:1 1 auto;overflow-y:auto;min-height:120px;margin:0 -8px;padding:0 8px}
.pick-row{display:flex;align-items:center;gap:12px;padding:6px;border-radius:12px}
.pick-row:hover{background:rgba(255,255,255,.05)}
.pick-row .art{width:42px;border-radius:8px}
.pick-row .t-text{flex:1}
.pick-row .btn{height:34px;padding:0 14px;font-size:13px}

/* menu */
.scrim{position:fixed;inset:0;z-index:55}
.menu{position:fixed;z-index:60;min-width:220px;max-width:min(300px,calc(100vw - 16px));padding:6px;border-radius:15px;background:var(--raised);border:1px solid var(--line);box-shadow:0 20px 56px rgba(0,0,0,.55)}
.menu button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:10px;text-align:left;font-weight:600;font-size:14px}
.menu button:hover,.menu button:focus-visible{background:rgba(255,255,255,.09)}
.menu button.danger{color:#ff9d9a}
.menu .m-title{padding:8px 12px 6px;color:var(--muted);font-size:12.5px;font-weight:700}
.menu button svg{color:var(--muted)}
.menu button.danger svg{color:#ff9d9a}
@media(max-width:560px){
  .scrim.sheet{background:rgba(0,0,0,.5)}
  .menu{left:8px!important;right:8px;top:auto!important;bottom:calc(8px + var(--safe-b));max-width:none;border-radius:20px;padding:8px}
  .menu button{padding:14px 12px}
}

.toast{position:fixed;z-index:70;left:50%;bottom:calc(var(--dock) + 12px);transform:translate(-50%,10px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;background:var(--raised-2);border:1px solid var(--line);padding:11px 20px;border-radius:999px;font-weight:650;font-size:14px;box-shadow:0 14px 40px rgba(0,0,0,.5);max-width:min(92vw,520px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.np.open~.toast,body.lock .toast{bottom:auto;top:calc(64px + env(safe-area-inset-top,0px))}
.drop{position:fixed;inset:12px;z-index:90;display:none;place-items:center;border:2px dashed var(--acc);border-radius:26px;background:rgba(8,14,21,.86);font-size:20px;font-weight:750;pointer-events:none}
.drop.on{display:grid}

body.native [data-act=import],body.native .add-top,body.native #pickImport,body.native .side-foot{display:none!important}
body.native .tabbar{grid-template-columns:repeat(4,1fr)}
body:not(.native) [data-nav=discover]{display:none!important}
body.native{overscroll-behavior:none;-webkit-user-select:none;user-select:none}
body.native input{-webkit-user-select:text;user-select:text}


/* home (Spotify-style) */
.home-head{margin:0 0 18px}
.home-head h1{font-size:clamp(26px,3.6vw,34px);font-weight:800;letter-spacing:-.035em}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:34px}
@media(min-width:900px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}}
.tile{display:flex;align-items:center;gap:12px;height:56px;padding-right:10px;border-radius:8px;overflow:hidden;background:rgba(255,255,255,.085);text-align:left;font-weight:700;font-size:13.5px;line-height:1.25;transition:background .15s}
.tile:hover{background:rgba(255,255,255,.15)}
.tile .art{width:56px;height:56px;border-radius:0}
.tile .art svg{width:40%;height:40%}
.tile-name{min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-sub.two{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal;line-height:1.35}
.card.round{text-align:center}
.card.round .art{border-radius:50%}
.card.round .art img{border-radius:50%}
.sec-head h2{font-size:21px}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 14px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 16px;border-radius:999px;background:rgba(255,255,255,.085);font-weight:650;font-size:13.5px;color:var(--text);transition:background .15s,color .15s,transform .1s}
.chip:hover{background:rgba(255,255,255,.15)}
.chip:active{transform:scale(.97)}
.chip.on{background:var(--acc);color:var(--on-acc)}
.chips.tabs{padding-bottom:20px}

/* playlist / collection page */
.main{position:relative}
.main::before{content:"";position:absolute;left:0;right:0;top:0;height:520px;pointer-events:none;background:linear-gradient(180deg,color-mix(in srgb,var(--hero,transparent) 60%,transparent) 0%,color-mix(in srgb,var(--hero,transparent) 22%,transparent) 55%,transparent 100%)}
.main>*{position:relative}
.col-hero{display:flex;align-items:flex-end;gap:26px;padding:6px 0 8px}
.col-cover{position:relative;display:block;width:clamp(132px,22vw,220px);flex:none;border-radius:14px;overflow:hidden;box-shadow:0 22px 56px rgba(0,0,0,.5);text-align:left}
.col-cover .art{width:100%;border-radius:0}
.col-cover.round{border-radius:50%}
.col-cover.round .art{border-radius:50%}
.cover-badge{position:absolute;right:8px;bottom:8px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(6,12,18,.72);backdrop-filter:blur(6px);color:#fff;transition:transform .15s}
.cover-badge svg{width:18px;height:18px}
button.col-cover:hover .cover-badge{transform:scale(1.1)}
.col-meta .kind{font-size:13px;font-weight:700;margin-bottom:6px}
.col-meta h1{font-size:clamp(30px,6vw,64px);font-weight:800;letter-spacing:-.045em;line-height:1.02;overflow-wrap:anywhere}
.col-meta .sub{margin-top:10px;color:rgba(233,240,246,.75);font-size:14px}
.col-bar{display:flex;align-items:center;gap:10px;margin:18px 0 22px}
.fab{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:var(--on-acc);box-shadow:0 10px 28px rgba(0,0,0,.35);transition:transform .12s,filter .15s}
.fab:hover{transform:scale(1.06);filter:brightness(1.06)}
.fab:active{transform:scale(.96)}
.fab svg{width:26px;height:26px}
.icon-btn.lg{width:48px;height:48px}
.icon-btn.lg svg{width:24px;height:24px}
@media(max-width:700px){
  .col-hero{flex-direction:column;align-items:center;text-align:center;gap:18px}
  .col-bar{justify-content:flex-start}
}

/* create / edit playlist sheet */
.form-row{display:flex;gap:18px;align-items:flex-start;margin-top:14px}
.cover-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none}
.cover-pick{width:116px;height:116px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:rgba(255,255,255,.06) center/cover no-repeat;border:1.5px dashed var(--line);color:var(--muted);font-size:12.5px;font-weight:650;transition:border-color .15s,background-color .15s}
.cover-pick:hover{border-color:var(--acc);color:var(--text)}
.cover-pick svg{width:26px;height:26px}
.cover-pick.has{border-style:solid;border-color:transparent}
.cover-pick.has svg,.cover-pick.has span{display:none}
.field{flex:1;min-width:0}
.field label{display:block;margin-bottom:6px;color:var(--muted);font-size:12.5px;font-weight:700}
.field .count{margin-top:6px;text-align:right;color:var(--faint);font-size:12px}
@media(max-width:560px){
  dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:26px 26px 0 0;border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px)}
  dialog.wide{height:min(88dvh,740px)}
  .form-row{flex-direction:column;align-items:center}
  .field{width:100%}
}
@media(max-width:899px){.mobile-head{display:flex}}

/* layout: sidebar hidden below 900px */
body.has-player{--dock:112px}
@media(max-width:899px){
  :root{--dock:calc(var(--tab) + var(--safe-b) + 8px)}
  body.has-player{--dock:calc(var(--tab) + var(--safe-b) + 112px)}
  .shell{grid-template-columns:minmax(0,1fr)}
  .sidebar{display:none}
  .tabbar{display:grid}
  .dock{left:12px;right:12px;bottom:calc(var(--tab) + var(--safe-b) + 8px)}
  .topbar .add-top{display:none}
  .searchbar{max-width:none}
  .topbar .spacer{display:none}
}
@media(max-width:700px){
  body.has-player{--dock:calc(var(--tab) + var(--safe-b) + 90px)}
  .dock{grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:9px 10px 11px;border-radius:18px;overflow:hidden}
  .dock .now .art{width:46px;border-radius:9px}
  .dock .seek-row,.dock .dock-right,.dock .controls .hide-sm{display:none}
  .dock .controls{gap:2px}
  .dock .play-btn{width:42px;height:42px}
  .dock-progress{display:block;position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.1)}
  .dock-progress i{display:block;height:100%;width:100%;background:var(--acc);transform:scaleX(0);transform-origin:0 50%;will-change:transform}
  .dock .like{display:none}
  .hero{flex-direction:column;align-items:flex-start;gap:16px}
  .hero .art{width:132px}
  .col-head{flex-direction:column;align-items:flex-start;gap:18px}
}
@media(pointer:coarse){
  .icon-btn{min-width:44px;min-height:44px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .eq i{animation:none;transform:scaleY(.7)}
  .welcome .bars i{animation:none}
}
.chips:not(.tabs) .chip{height:32px;padding:0 14px;font-size:13px;background:transparent;border:1px solid var(--line);color:var(--muted)}
.chips:not(.tabs) .chip:hover{color:var(--text);background:rgba(255,255,255,.06)}
.chips:not(.tabs) .chip.on{background:color-mix(in srgb,var(--acc) 22%,transparent);border-color:color-mix(in srgb,var(--acc) 60%,transparent);color:var(--text)}

/* online */
.tag{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--muted);vertical-align:2px}
.np-note{color:var(--faint);font-size:13px;margin-top:6px}
.np-note:empty{display:none}
.ds-search{max-width:none;margin-bottom:14px}
.note{color:var(--muted);font-size:13px;margin:0 0 22px;max-width:620px}
.loading{display:flex;align-items:center;justify-content:center;gap:12px;padding:46px 0;color:var(--muted)}
.spinner{width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(255,255,255,.18);border-top-color:var(--acc);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sec-head{flex-wrap:wrap}
.sec-tools .link-btn{white-space:nowrap}
body.view-discover .topbar{display:none}
@media(max-width:700px){.sec-head h2{font-size:19px}}

/* ===== theme: surfaces use tokens (Classic dark by default, Glass when body.glass) ===== */
.sidebar{background:var(--sb-bg);backdrop-filter:blur(var(--blur)) saturate(1.5);border-right:1px solid var(--edge)}
.dock{background:var(--dock-bg);backdrop-filter:blur(var(--blur)) saturate(1.6);border:1px solid var(--edge)}
.tabbar{background:var(--tab-bg);backdrop-filter:blur(var(--blur)) saturate(1.5);border-top:1px solid var(--edge)}
dialog,.menu{background:var(--pop-bg);backdrop-filter:blur(var(--blur)) saturate(1.5);border:1px solid var(--edge)}
.card,.rail .card{background:var(--card);padding:12px;border-radius:12px;transition:background .18s}
.card:hover,.rail .card:hover{background:var(--card-hover)}
.rail .card{flex:0 0 168px}
.rail .card:hover .art{filter:none}
.card.new{background:transparent}
.tile{background:var(--card-hover)}
.tile:hover{background:rgba(255,255,255,.17)}
.chip{background:var(--card-hover)}
.chip.on{background:var(--acc);color:var(--on-acc)}
.chips:not(.tabs) .chip{background:transparent}
.chips:not(.tabs) .chip.on{background:color-mix(in srgb,var(--acc) 22%,transparent)}
body:not(.glass) .ambient{opacity:.5}
body:not(.glass) .searchbar{background:rgba(255,255,255,.1);border-color:transparent}
.aw{position:relative;display:block}
.aw .art{margin-bottom:10px}
.card-fab{position:absolute;right:8px;bottom:18px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:var(--on-acc);box-shadow:0 8px 20px rgba(0,0,0,.45);opacity:0;transform:translateY(8px);transition:opacity .18s,transform .18s}
.card-fab svg{width:20px;height:20px}
@media(hover:hover){.card:hover .card-fab,.card:focus-visible .card-fab{opacity:1;transform:none}}
@media(hover:none){.card-fab{display:none}}

/* glass */
.ambient::after{content:"";position:absolute;width:70vmax;height:70vmax;right:-28vmax;top:28%;border-radius:50%;background:radial-gradient(circle,hsla(var(--h),70%,50%,.16),transparent 65%);pointer-events:none}
body:not(.glass) .ambient::after{display:none}
body.glass{
  --sb-bg:rgba(255,255,255,.04);
  --dock-bg:rgba(42,42,50,.66);
  --tab-bg:rgba(14,14,18,.72);
  --pop-bg:rgba(36,36,44,.7);
  --blur:36px;
  --edge:rgba(255,255,255,.15);
  --card:rgba(255,255,255,.065);
  --card-hover:rgba(255,255,255,.13);
}
body.glass .dock{box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 24px 70px rgba(0,0,0,.5)}
body.glass .tile,body.glass .card,body.glass .chip,body.glass .searchbar,body.glass .empty,body.glass .welcome{backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
body.glass .searchbar{background:rgba(255,255,255,.08)}
body.glass .chips:not(.tabs) .chip{background:rgba(255,255,255,.04)}
body.glass .btn{background:rgba(255,255,255,.1);border:1px solid var(--edge);backdrop-filter:blur(14px)}
body.glass .btn.primary{background:var(--acc);border-color:transparent}
body.glass .btn.danger{background:#d9534f;border-color:transparent}
body.glass .tile{border-radius:10px}
body.glass .card.new{border:1px dashed var(--edge)}
body.glass .track.is-current{background:color-mix(in srgb,var(--acc) 14%,rgba(255,255,255,.04))}
body.glass .queue{background:var(--card);border:1px solid var(--edge);border-radius:22px;padding:16px;backdrop-filter:blur(20px)}
body.glass .toast{background:rgba(44,44,52,.8);backdrop-filter:blur(20px);border-color:var(--edge)}
body.glass .col-cover,body.glass .hero{box-shadow:0 22px 60px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.12)}
body.glass .cover-badge,body.glass .play-btn{box-shadow:0 6px 18px rgba(0,0,0,.4)}
.np{background:var(--bg)}
body.glass .np-glow{opacity:1}
.welcome{background:var(--card)}

/* settings sheet */
.set-label{margin:18px 0 10px;color:var(--muted);font-size:12.5px;font-weight:700}
.theme-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.theme-card{border-radius:16px;padding:10px;border:2px solid transparent;background:var(--card);text-align:left;display:flex;flex-direction:column;gap:10px;font-weight:700;font-size:14px}
.theme-card i{display:block;height:64px;border-radius:10px}
.theme-card.glass-prev i{background:radial-gradient(circle at 25% 20%,rgba(30,215,96,.55),transparent 60%),radial-gradient(circle at 85% 90%,rgba(91,140,255,.5),transparent 60%),#15151a;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2),inset 0 1px 0 rgba(255,255,255,.3)}
.theme-card.dark-prev i{background:#121212;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.theme-card.on{border-color:var(--acc)}
.swatches{display:flex;flex-wrap:wrap;gap:12px}
.swatch{width:44px;height:44px;border-radius:50%;border:3px solid transparent;display:grid;place-items:center;color:#04140a;background-clip:padding-box}
.swatch.on{border-color:var(--text)}
.swatch svg{width:18px;height:18px;opacity:0}
.swatch.on svg{opacity:1}
.swatch.song{background:conic-gradient(#ff6b6b,#ffd166,#06d6a0,#4cc9f0,#b388ff,#ff6b6b)}
.swatch-label{font-size:11px;color:var(--muted);text-align:center;margin-top:4px}
.brand .icon-btn{margin-left:auto}
.mobile-head .icon-btn{margin-left:auto}

/* ============ MORE GLASS ============ */
.blob{position:absolute;border-radius:50%;opacity:0;pointer-events:none;will-change:transform;transition:opacity .8s}
.b1{width:70vmax;height:70vmax;left:-26vmax;top:-24vmax;background:radial-gradient(circle,hsla(var(--h),85%,55%,.62),transparent 66%);animation:drift1 24s ease-in-out infinite alternate}
.b2{width:60vmax;height:60vmax;right:-24vmax;top:18%;background:radial-gradient(circle,hsla(calc(var(--h) + 70),85%,58%,.5),transparent 66%);animation:drift2 30s ease-in-out infinite alternate}
.b3{width:56vmax;height:56vmax;left:6%;bottom:-26vmax;background:radial-gradient(circle,hsla(calc(var(--h) - 60),80%,52%,.5),transparent 66%);animation:drift3 36s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate3d(16vmax,12vmax,0) scale(1.18)}}
@keyframes drift2{to{transform:translate3d(-14vmax,-10vmax,0) scale(1.12)}}
@keyframes drift3{to{transform:translate3d(12vmax,-14vmax,0) scale(1.2)}}
body.glass .blob{opacity:1}
.ambient::after{display:none!important}
body.glass{
  --sb-bg:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.04));
  --dock-bg:linear-gradient(135deg,rgba(255,255,255,.26),rgba(255,255,255,.08));
  --tab-bg:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.07));
  --pop-bg:linear-gradient(140deg,rgba(255,255,255,.22),rgba(255,255,255,.07));
  --blur:46px;
  --edge:rgba(255,255,255,.3);
  --card:linear-gradient(145deg,rgba(255,255,255,.19),rgba(255,255,255,.05));
  --card-hover:linear-gradient(145deg,rgba(255,255,255,.3),rgba(255,255,255,.1));
}
body.glass .dock,body.glass .tabbar,body.glass .sidebar{backdrop-filter:blur(var(--blur)) saturate(1.9) brightness(1.08)}
body.glass dialog,body.glass .menu{background:var(--pop-bg),rgba(18,18,24,.5);backdrop-filter:blur(var(--blur)) saturate(1.9)}
body.glass .dock{box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 0 0 1px rgba(255,255,255,.06),0 26px 70px rgba(0,0,0,.45)}
body.glass .tabbar{box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
body.glass .tile,body.glass .card,body.glass .chip,body.glass .searchbar,body.glass .empty,body.glass .welcome,body.glass .btn,body.glass .queue{backdrop-filter:none;border:1px solid var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.38),0 10px 30px rgba(0,0,0,.18)}
body.glass .searchbar{background:linear-gradient(145deg,rgba(255,255,255,.2),rgba(255,255,255,.07))}
body.glass .chips:not(.tabs) .chip{background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.03))}
body.glass .chip.on,body.glass .btn.primary{background:var(--acc);border-color:rgba(255,255,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 8px 24px color-mix(in srgb,var(--acc) 40%,transparent)}
body.glass .chips:not(.tabs) .chip.on{background:color-mix(in srgb,var(--acc) 28%,rgba(255,255,255,.08));box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
body.glass .track:hover{background:linear-gradient(90deg,rgba(255,255,255,.14),rgba(255,255,255,.04))}
body.glass .track.is-current{background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 26%,rgba(255,255,255,.08)),rgba(255,255,255,.03));box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
body.glass .queue{border-radius:24px}
body.glass .cs-bg{background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.07)),color-mix(in srgb,var(--hero) 45%,rgba(10,10,14,.5))}
body.glass .col-back{background:linear-gradient(145deg,rgba(255,255,255,.3),rgba(255,255,255,.1));border:1px solid var(--edge)}

/* ============ ANIMATIONS ============ */
@keyframes rise{from{opacity:0;transform:translate3d(0,18px,0)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes sheetIn{from{opacity:0;transform:translate3d(0,34px,0) scale(.97)}to{opacity:1;transform:none}}
@keyframes menuIn{from{opacity:0;transform:scale(.93) translateY(-8px)}to{opacity:1;transform:none}}
@keyframes dockIn{from{opacity:0;transform:translate3d(0,46px,0) scale(.95)}to{opacity:1;transform:none}}
@keyframes heartPop{0%{transform:scale(1)}30%{transform:scale(1.5)}60%{transform:scale(.88)}100%{transform:scale(1)}}
@keyframes tabPop{0%{transform:scale(.6) translateY(4px)}100%{transform:none}}
@keyframes shimmer{to{background-position:-200% 0}}
#view.view-in>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
#view.view-in>*:nth-child(2){animation-delay:.06s}
#view.view-in>*:nth-child(3){animation-delay:.12s}
#view.view-in>*:nth-child(4){animation-delay:.18s}
#view.view-in>*:nth-child(5){animation-delay:.24s}
#view.view-in>*:nth-child(6){animation-delay:.3s}
#view.view-in>*:nth-child(n+7){animation-delay:.36s}
#view.view-in .tile{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 55ms + 60ms)}
#view.view-in .track{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--n,0) * 32ms + 80ms)}
#view.view-in .rail .card:nth-child(1){animation:rise .55s cubic-bezier(.2,.8,.2,1) .18s both}
#view.view-in .rail .card:nth-child(2){animation:rise .55s cubic-bezier(.2,.8,.2,1) .26s both}
#view.view-in .rail .card:nth-child(3){animation:rise .55s cubic-bezier(.2,.8,.2,1) .34s both}
#view.view-in .rail .card:nth-child(n+4){animation:rise .55s cubic-bezier(.2,.8,.2,1) .4s both}
.card,.tile,.chip,.btn,.fab,.icon-btn,.nav-item,.tab,.t-play,.col-back{touch-action:manipulation;transition:transform .22s cubic-bezier(.2,.8,.2,1),background .22s,box-shadow .22s,opacity .22s,color .2s}
.card:active,.tile:active,.chip:active,.btn:active{transform:scale(.96)}
.track{transition:background .2s,transform .15s}
.track:active{transform:scale(.985)}
@media(hover:hover){.card:hover{transform:translateY(-4px)}.tile:hover{transform:translateY(-2px)}}
.tab[aria-current=page] svg{animation:tabPop .5s cubic-bezier(.3,1.6,.5,1)}
.like.pop svg{animation:heartPop .55s cubic-bezier(.3,1.4,.5,1)}
.dock{animation:dockIn .6s cubic-bezier(.2,.8,.2,1)}
dialog[open]{animation:sheetIn .42s cubic-bezier(.2,.8,.2,1)}
dialog[open]::backdrop{animation:fadeIn .35s}
.menu:not([hidden]){animation:menuIn .25s cubic-bezier(.2,.8,.2,1);transform-origin:top right}
.np.open .np-info,.np.open .np-seek,.np.open .np-controls,.np.open .np-vol{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.np.open .np-seek{animation-delay:.06s}.np.open .np-controls{animation-delay:.12s}.np.open .np-vol{animation-delay:.18s}
.q-row{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k,0) * 45ms)}
.play-btn,.fab{transition:transform .2s cubic-bezier(.3,1.5,.5,1),filter .2s}
.toast{transition:opacity .3s,transform .4s cubic-bezier(.2,.9,.3,1.2)}
.skeleton-list{display:flex;flex-direction:column;gap:12px;padding:6px 0}
.sk-row{display:flex;align-items:center;gap:14px}
.sk-row i{width:48px;height:48px;border-radius:8px;flex:none}

/* ============ PLAYLIST HEADER THAT SHRINKS ON SCROLL ============ */

body.glass .tabbar{background:var(--tab-bg),rgba(10,10,14,.76)}

/* ================================================================
   v6: buttons, glass edges, home, album page, player, add-songs sheet
   ================================================================ */
:root{--tab:66px}

/* ---- ripple + button feel ---- */
.btn,.btn-wide,.play-btn,.fab,.ctl-btn,.round-btn,.round-play,.f-play,.f-ico,.chip,.tab{position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.4);transform:scale(0);animation:ripple .65s ease-out forwards;pointer-events:none}
@keyframes ripple{to{transform:scale(1);opacity:0}}
.play-btn .ripple,.btn.primary .ripple,.chip.on .ripple,.btn-wide.play .ripple,.tab[aria-current=page] .ripple,.fab .ripple,.f-play .ripple{background:rgba(0,0,0,.2)}
.btn.primary,.btn-wide.play{background-image:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 55%)}
.btn svg{transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.btn[data-act=add-songs]:hover svg,.btn[data-act=import]:hover svg,.btn[data-act=new-playlist]:hover svg,.btn:active svg{transform:rotate(90deg)}
.btn.small{height:36px;padding:0 14px;font-size:13px}
.btn:disabled{opacity:.5;pointer-events:none}
.btn.pop svg{animation:checkPop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes checkPop{0%{transform:scale(0) rotate(-50deg)}100%{transform:none}}
@keyframes iconSwap{0%{transform:rotate(-80deg) scale(.4);opacity:0}100%{transform:none;opacity:1}}
@keyframes pulseRing{0%{box-shadow:0 14px 34px rgba(0,0,0,.4),0 0 0 0 color-mix(in srgb,var(--acc) 55%,transparent)}70%{box-shadow:0 14px 34px rgba(0,0,0,.4),0 0 0 20px transparent}100%{box-shadow:0 14px 34px rgba(0,0,0,.4),0 0 0 0 transparent}}
.play-btn{background:linear-gradient(145deg,#fff,#dde1ec);box-shadow:0 8px 22px rgba(0,0,0,.35)}
.play-btn.swap svg{animation:iconSwap .42s cubic-bezier(.3,1.5,.5,1)}
.round-btn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--text);background:var(--card-hover);border:1px solid var(--edge);transition:transform .25s cubic-bezier(.3,1.5,.5,1),background .2s}
.round-btn:active{transform:scale(.88)}
.round-btn.sm{width:40px;height:40px}
.round-btn.sm svg{width:20px;height:20px}
.round-play{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;color:var(--text);background:rgba(255,255,255,.14);transition:transform .25s cubic-bezier(.3,1.5,.5,1),background .2s,color .2s}
.round-play:hover{background:var(--acc);color:var(--on-acc)}
.round-play:active{transform:scale(.86)}
.round-play svg{width:20px;height:20px}

/* ---- floating pill navigation (phone) ---- */
@media(max-width:899px){
  .tabbar{left:14px;right:14px;bottom:calc(10px + var(--safe-b));height:var(--tab);padding:0 8px;border-radius:34px;border:1px solid var(--edge);grid-template-columns:repeat(4,1fr);align-items:center;justify-items:center;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.45)}
  .tab{width:52px;height:52px;border-radius:50%;flex-direction:row;gap:0;transition:background .35s cubic-bezier(.2,.8,.2,1),transform .25s cubic-bezier(.3,1.5,.5,1),color .25s}
  .tab .tl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .tab svg{width:24px;height:24px}
  .tab:active{transform:scale(.88)}
  .tab[aria-current=page]{background:var(--acc);color:var(--on-acc);box-shadow:0 8px 22px color-mix(in srgb,var(--acc) 45%,transparent)}
  .tab[aria-current=page] svg{color:var(--on-acc)}
  .dock{bottom:calc(var(--tab) + 22px + var(--safe-b))}
  :root{--dock:calc(var(--tab) + 36px + var(--safe-b))}
  body.has-player{--dock:calc(var(--tab) + 122px + var(--safe-b))}
  body.view-home .topbar,body.view-home .mobile-head{display:none}
}
@media(max-width:700px){body.has-player{--dock:calc(var(--tab) + 112px + var(--safe-b))}}

/* ---- player bar: cover fades in from the left, white square play button ---- */
.dock{overflow:hidden}
.dock::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:var(--dock-art,none) left center/cover no-repeat,linear-gradient(90deg,var(--dock-tint,transparent),transparent 70%);filter:blur(16px) saturate(1.5);transform:scale(1.25);opacity:.62;-webkit-mask-image:linear-gradient(90deg,#000 10%,transparent 78%);mask-image:linear-gradient(90deg,#000 10%,transparent 78%)}
.dock>*:not(.dock-progress){position:relative;z-index:1}
.dock>.dock-progress{z-index:2}
@media(max-width:899px){
  .dock{padding:10px 12px;border-radius:28px}
  .dock .now .art{width:56px;border-radius:15px;box-shadow:0 6px 16px rgba(0,0,0,.4)}
  .dock .play-btn{width:54px;height:54px;border-radius:18px}
  .dock .like{display:grid}
}
@media(max-width:700px){
  .dock{grid-template-columns:minmax(0,1fr) auto;gap:6px;padding:10px 12px 12px}
  .dock .now .art{width:56px}
  .dock .play-btn{width:54px;height:54px;border-radius:18px}
  .dock .like{display:grid}
  .dock-progress{left:14px;right:14px;bottom:5px;height:3px;border-radius:3px}
}

/* ---- stronger glass: bright gradient edges ---- */
.card,.tile,.pl-row,.feature{position:relative}
body.glass .dock,body.glass .tabbar,body.glass .card,body.glass .tile,body.glass dialog,body.glass .menu,body.glass .queue,body.glass .pl-row{border-color:transparent}
body.glass .dock::after,body.glass .tabbar::after,body.glass .card::after,body.glass .tile::after,body.glass dialog::after,body.glass .menu::after,body.glass .queue::after,body.glass .pl-row::after,body.glass .col-back::after,body.glass .round-btn::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(140deg,rgba(255,255,255,.78),rgba(255,255,255,.1) 36%,rgba(255,255,255,.04) 62%,rgba(255,255,255,.4));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;pointer-events:none;z-index:3}
body.glass .pl-row{background:var(--card);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 10px 28px rgba(0,0,0,.2)}
body.glass .round-btn{background:linear-gradient(145deg,rgba(255,255,255,.26),rgba(255,255,255,.08));border-color:transparent;position:relative}
body.glass .track.is-current{background:linear-gradient(135deg,rgba(255,255,255,.24),rgba(255,255,255,.08));box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.track.is-current{background:rgba(255,255,255,.12);border-radius:16px}
body.glass .tabbar{background:var(--tab-bg),rgba(10,10,14,.62)}

/* ---- home (curated cards, playlists, header) ---- */
.hello{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.avatar{width:50px;height:50px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:19px;color:#fff;background:conic-gradient(from 200deg,var(--acc),#7b5cff,#ff5ca8,var(--acc));box-shadow:0 0 0 3px rgba(255,255,255,.1),0 8px 26px color-mix(in srgb,var(--acc) 40%,transparent);transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.avatar:active{transform:scale(.9) rotate(-8deg)}
.avatar span{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:rgba(10,10,14,.8)}

.feature-rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}

.feature{flex:0 0 min(86%,430px);scroll-snap-align:start;min-height:196px;padding:22px;border-radius:30px;display:flex;overflow:hidden;color:#17121f;cursor:pointer;background:linear-gradient(135deg,hsl(var(--fh) 80% 82%),hsl(calc(var(--fh) + 40) 72% 66%));box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 18px 44px rgba(0,0,0,.35);transition:transform .35s cubic-bezier(.2,.8,.2,1)}

.f-text{position:relative;z-index:3;max-width:56%;display:flex;flex-direction:column}
.f-text h3{font-size:25px;font-weight:800;letter-spacing:-.04em;line-height:1.08}

.f-play:hover{transform:scale(1.08)}
.f-play:active{transform:scale(.9)}

.fa .art{width:100%;border-radius:20px;box-shadow:0 16px 36px rgba(0,0,0,.35)}

.feature:hover .fa0{transform:rotate(3deg) scale(1.06)}

.pl-list{display:flex;flex-direction:column;gap:10px}

/* ---- full-screen player: buttons, slider, glow ---- */
.np-art-wrap{position:relative;width:min(100%,460px)}
.np-art-wrap .np-art{width:100%}

@keyframes ringBreath{to{transform:scale(1.14);opacity:.9}}

/* ================================================================
   v7: fixed background + liquid glass
   ================================================================ */
:root{--bg:#09090d}
html{background:#09090d}
body{background:radial-gradient(1100px 650px at 18% -12%,rgba(86,104,255,.1),transparent 60%),radial-gradient(900px 600px at 100% 108%,rgba(40,200,150,.06),transparent 60%),#09090d;background-attachment:fixed}
.ambient,.blob,.np-glow{display:none!important}
.main::before{display:none!important}
.np{background:radial-gradient(1000px 600px at 18% -12%,rgba(86,104,255,.1),transparent 60%),#09090d}

body.glass{
  --lg-fill:linear-gradient(145deg,rgba(255,255,255,.2) 0%,rgba(255,255,255,.07) 42%,rgba(255,255,255,.13) 100%);
  --lg-fill-strong:linear-gradient(145deg,rgba(255,255,255,.3) 0%,rgba(255,255,255,.1) 45%,rgba(255,255,255,.19) 100%);
  --lg-rim:inset 0 1px 0 rgba(255,255,255,.62),inset 0 -1px 0 rgba(255,255,255,.16),inset 1px 0 0 rgba(255,255,255,.18),inset -1px 0 0 rgba(255,255,255,.1),inset 0 0 24px rgba(255,255,255,.07);
  --lg-drop:0 10px 30px rgba(0,0,0,.38);
}
/* buttons, chips, cards, playlist rows */
body.glass :is(.btn,.chip,.round-btn,.ctl-btn,.btn-wide.ghost,.searchbar,.tile,.card,.pl-row,.empty,.sort,.theme-card,.queue,.pick-row,.num-btn){background:var(--lg-fill);box-shadow:var(--lg-rim),var(--lg-drop);border:0;backdrop-filter:none}
body.glass :is(.btn,.chip,.round-btn,.ctl-btn,.btn-wide.ghost,.tile,.card,.pl-row):hover{background:var(--lg-fill-strong)}
body.glass .pick-row{box-shadow:var(--lg-rim);margin-bottom:6px}
body.glass .chips:not(.tabs) .chip{background:var(--lg-fill)}
body.glass .ctl-btn[data-ctl=shuffle],body.glass .ctl-btn[data-ctl=repeat]{background:transparent;box-shadow:none}
/* accent buttons: tinted glass */
body.glass :is(.btn.primary,.chip.on,.btn-wide.play,.fab,.tab[aria-current=page],.edit-btn.on){background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 76%,#fff) 0%,var(--acc) 55%,color-mix(in srgb,var(--acc) 84%,#000) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.78),inset 0 -2px 6px rgba(0,0,0,.22),0 10px 26px color-mix(in srgb,var(--acc) 34%,transparent);color:var(--on-acc)}
body.glass .chips:not(.tabs) .chip.on{background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 40%,rgba(255,255,255,.2)),color-mix(in srgb,var(--acc) 24%,rgba(255,255,255,.06)));box-shadow:var(--lg-rim),0 8px 22px color-mix(in srgb,var(--acc) 22%,transparent);color:var(--text)}
/* bars: clear glass over the content */
body.glass .dock,body.glass .tabbar{background:var(--lg-fill-strong),rgba(18,20,28,.34);backdrop-filter:blur(20px) saturate(2) brightness(1.12);-webkit-backdrop-filter:blur(20px) saturate(2) brightness(1.12);box-shadow:var(--lg-rim),0 22px 60px rgba(0,0,0,.5);border:0}
body.glass .dock::after,body.glass .tabbar::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:0;-webkit-mask:none;mask:none;background:radial-gradient(120% 90% at 10% -30%,rgba(255,255,255,.4),rgba(255,255,255,0) 52%),radial-gradient(90% 80% at 100% 130%,rgba(255,255,255,.16),rgba(255,255,255,0) 55%);pointer-events:none;z-index:3}
body.glass :is(.card,.tile,dialog,.menu,.queue,.pl-row,.col-back,.round-btn)::after{content:none}
body.glass .sidebar{background:var(--lg-fill),rgba(14,16,22,.4);backdrop-filter:blur(24px) saturate(1.8);border-right:0;box-shadow:inset -1px 0 0 rgba(255,255,255,.14)}
body.glass dialog,body.glass .menu{background:var(--lg-fill-strong),rgba(20,22,30,.6);backdrop-filter:blur(30px) saturate(2) brightness(1.1);box-shadow:var(--lg-rim),0 30px 90px rgba(0,0,0,.6);border:0}
body.glass .cs-bg{background:var(--lg-fill-strong),rgba(18,20,28,.42);backdrop-filter:blur(20px) saturate(2);box-shadow:inset 0 -1px 0 rgba(255,255,255,.22);border-bottom:0}
body.glass .col-back{background:var(--lg-fill-strong);box-shadow:var(--lg-rim),var(--lg-drop);backdrop-filter:blur(12px);border:0}
body.glass .toast{background:var(--lg-fill-strong),rgba(20,22,30,.6);box-shadow:var(--lg-rim),0 14px 40px rgba(0,0,0,.5);border:0}
/* songs: every row is a glass capsule */
body.glass .track{background:var(--lg-fill);box-shadow:var(--lg-rim);border-radius:22px;margin-bottom:8px}
body.glass .track:hover{background:var(--lg-fill-strong)}
body.glass .track.is-current{background:var(--lg-fill-strong);box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 0 0 1px color-mix(in srgb,var(--acc) 60%,transparent),inset 0 0 26px color-mix(in srgb,var(--acc) 16%,transparent)}
body.glass .t-head{border-bottom:0}

/* playlist rows keep the cover picture next to the number */
@media(max-width:760px){
  .tracks.plain .t-main .art{display:grid;width:50px;border-radius:14px}
  .tracks.plain .track{padding-top:7px;padding-bottom:7px}
}

/* edit mode (reorder) */
.t-idx .num-btn{display:none}
.num-btn{width:38px;height:38px;border-radius:13px;font-weight:800;font-size:14px;place-items:center;color:var(--text);background:rgba(255,255,255,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.4);transition:transform .22s cubic-bezier(.3,1.5,.5,1)}
.num-btn:active{transform:scale(.88)}
.tracks.editing .t-idx .num,.tracks.editing .t-idx .eq,.tracks.editing .t-idx .t-play{display:none!important}
.tracks.editing .t-idx .num-btn{display:grid}
.tracks.editing{--cols:46px minmax(0,2fr) minmax(0,1.2fr) 56px 40px 40px}
@media(max-width:760px){.tracks.editing{--cols:46px minmax(0,1fr) 40px 40px}}
.mv{width:38px;height:38px}
.edit-hint{margin:-6px 0 14px;color:var(--muted);font-size:13px}
.edit-btn.on{background:var(--acc);color:var(--on-acc)}
@keyframes moved{0%{box-shadow:inset 0 0 0 2px var(--acc),0 0 28px color-mix(in srgb,var(--acc) 60%,transparent)}100%{box-shadow:inset 0 0 0 0 transparent,0 0 0 transparent}}
.track.moved{animation:moved 1.2s ease-out}
.stepper{display:flex;align-items:center;gap:12px;margin:2px 0 16px}
.stepper input{width:96px;height:52px;text-align:center;font-size:24px;font-weight:800;border-radius:16px;background:var(--bg);border:1px solid var(--line);color:var(--text);outline:none;-moz-appearance:textfield}
.stepper input:focus{border-color:var(--acc)}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper .round-btn{width:48px;height:48px;font-size:24px;font-weight:600}
#moveDlg .chips{margin:0}
body.glass .tabbar{background:var(--lg-fill-strong),rgba(16,18,26,.56)}
body.glass .dock{background:var(--lg-fill-strong),rgba(16,18,26,.5)}


/* ================================================================
   v8: cleaner playlist header + song list panel + drag to reorder
   ================================================================ */
/* header becomes one glass card */
.col-hero{align-items:center;gap:18px;padding:18px;border-radius:34px;margin-bottom:6px;transform-origin:50% 0;will-change:transform,opacity}
body.glass .col-hero{background:var(--lg-fill-strong),rgba(18,20,28,.3);box-shadow:var(--lg-rim),0 24px 60px rgba(0,0,0,.4)}
body:not(.glass) .col-hero{background:var(--card)}
.col-cover{position:relative;border-radius:26px;box-shadow:0 18px 40px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.14)}
.col-cover::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.34) 0%,rgba(255,255,255,0) 38%);pointer-events:none}
.col-meta .kind{font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--acc);margin-bottom:6px}
.col-meta h1{font-size:clamp(26px,7.4vw,40px);font-weight:800;letter-spacing:-.04em;line-height:1.04}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pills span{padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--text);background:rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.col-icons{margin-top:12px;flex-wrap:wrap}
@media(max-width:700px){.col-hero{padding:14px;gap:14px;border-radius:30px}.col-cover{border-radius:22px;width:min(38vw,160px)}}

/* song list: one glass panel, thin separators */
body.glass .tracks{background:var(--lg-fill);box-shadow:var(--lg-rim),var(--lg-drop);border-radius:30px;padding:8px}
body:not(.glass) .tracks{padding:0}
body.glass .tracks .t-head{padding:6px 14px 8px;margin:0 0 4px}
body.glass .track{background:none;box-shadow:none;border-radius:22px;margin:0;padding:8px 10px;position:relative}
body.glass .track:hover{background:rgba(255,255,255,.08)}
.track{position:relative}
.track:not(.is-current):not(:last-child)::after{content:"";position:absolute;left:84px;right:14px;bottom:0;height:1px;background:rgba(255,255,255,.07)}
.tracks.plain .track:not(.is-current):not(:last-child)::after{left:70px}
body.glass .track.is-current{background:linear-gradient(145deg,color-mix(in srgb,var(--acc) 26%,rgba(255,255,255,.14)),rgba(255,255,255,.06));box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 0 0 1px color-mix(in srgb,var(--acc) 55%,transparent),0 8px 24px color-mix(in srgb,var(--acc) 18%,transparent)}
.t-main .art{border-radius:15px;box-shadow:0 6px 14px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.14)}
.t-main{gap:13px}
.t-title{font-size:15.5px}
.t-artist{margin-top:1px}
.track .num{font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}
.track:active{transform:scale(.99)}
@media(max-width:760px){.tracks.plain .t-main .art{width:52px}}

/* edit mode + dragging */
.mv-stack{display:flex;flex-direction:column;justify-content:center}
.mv-stack .mv{width:34px;height:25px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.mv-stack .mv:active{background:rgba(255,255,255,.14);color:var(--text)}
.mv-stack .mv svg{width:17px;height:17px}
.grip{width:42px;height:46px;border-radius:14px;display:grid;place-items:center;color:var(--muted);touch-action:none;cursor:grab}
.grip svg{width:22px;height:22px}
.grip:active{color:var(--text);background:rgba(255,255,255,.1)}
.tracks.editing{--cols:46px minmax(0,2fr) minmax(0,1.2fr) 56px 36px 44px}
@media(max-width:760px){.tracks.editing{--cols:46px minmax(0,1fr) 36px 44px}}
.tracks.editing .track{content-visibility:visible;touch-action:pan-y}
.tracks.editing .track::after{display:none}
.track.dragging{z-index:6;transition:none!important;cursor:grabbing;background:var(--lg-fill-strong),rgba(30,32,42,.9)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 22px 50px rgba(0,0,0,.6)!important}
.tracks.is-dragging{touch-action:none}
body.no-select,body.no-select *{-webkit-user-select:none;user-select:none}

/* v8 polish */
.col-icons{gap:8px;flex-wrap:nowrap}
@media(max-width:700px){
  .col-icons .round-btn.sm{width:36px;height:36px}
  .col-icons .edit-btn{padding:0 12px}
  .col-icons .edit-btn svg{width:16px;height:16px}
  .tracks.editing{--cols:42px minmax(0,1fr) 32px 40px}
  .tracks.editing .t-inl{display:none}
  .num-btn{width:36px;height:36px}
  .grip{width:38px}
}


/* ================================================================
   v9: same-size covers, Up next, drag slot, tab highlight, smoothness
   ================================================================ */
/* every cover is an exact square, whatever the picture */
.art{aspect-ratio:1/1;contain:paint;overflow:hidden}
.art img{object-fit:cover;object-position:center;width:100%;height:100%;display:block}
.card .art,.aw .art,.rail .card .art{width:100%;aspect-ratio:1/1}
.rows-more{height:2px}

/* seek slider: bigger area so it is easy to grab and drag */
input.seek{height:36px;cursor:pointer}
.seek-row input.seek{height:30px}

/* Up next */
.queue{padding:18px 16px 16px}
.q-head{display:flex;align-items:baseline;justify-content:space-between;margin:0 4px 12px}
.q-head h3{font-size:19px;font-weight:800;letter-spacing:-.03em;margin:0}
.q-head span{color:var(--muted);font-size:12.5px;font-weight:650}
.q-card{position:relative;display:flex;align-items:center;gap:14px;width:100%;padding:10px 14px 10px 10px;margin-bottom:10px;border-radius:24px;text-align:left;background:var(--lg-fill,rgba(255,255,255,.08));box-shadow:var(--lg-rim,inset 0 1px 0 rgba(255,255,255,.2));animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k,0) * 70ms);transition:transform .25s cubic-bezier(.3,1.5,.5,1),background .2s}
.q-card:hover{background:var(--lg-fill-strong,rgba(255,255,255,.14))}
.q-card:active{transform:scale(.97)}
.q-card .art{width:56px;border-radius:16px;flex:none;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.q-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.q-title{font-size:15.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q-artist{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q-dur{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.q-badge{padding:5px 12px;border-radius:999px;font-size:12px;font-weight:800;color:var(--on-acc);background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 76%,#fff),var(--acc));box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 6px 16px color-mix(in srgb,var(--acc) 35%,transparent)}
.q-toggle{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:44px;margin-top:2px;border-radius:999px;font-size:14px;font-weight:700;color:var(--text);background:rgba(255,255,255,.07);transition:background .2s,transform .2s}
.q-toggle:hover{background:rgba(255,255,255,.13)}
.q-toggle:active{transform:scale(.97)}
.q-toggle svg{width:18px;height:18px}
.q-none{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:18px 10px;color:var(--muted);font-size:14px}
.q-none svg{width:30px;height:30px;color:var(--faint)}
.q-none p{margin:0;line-height:1.5}

/* drag: a slot shows exactly where the song will land */
.tracks{position:relative}
.drop-slot{position:absolute;left:8px;right:8px;z-index:1;pointer-events:none;border-radius:22px;border:2px dashed var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent);box-shadow:0 0 28px color-mix(in srgb,var(--acc) 35%,transparent),inset 0 0 22px color-mix(in srgb,var(--acc) 12%,transparent);transition:transform .32s cubic-bezier(.2,.9,.3,1.15);animation:slotIn .25s ease-out}
@keyframes slotIn{from{opacity:0;transform:scale(.96)}}
.track.dragging::before{content:attr(data-pos);position:absolute;left:-6px;top:-10px;min-width:30px;height:30px;padding:0 9px;display:grid;place-items:center;border-radius:999px;font-size:14px;font-weight:800;color:var(--on-acc);background:var(--acc);box-shadow:0 6px 18px color-mix(in srgb,var(--acc) 50%,transparent);z-index:7}
.track.dragging{transform-origin:center}
.add-row{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;margin-top:12px;border-radius:22px;font-weight:700;color:var(--muted);border:1.5px dashed var(--edge,rgba(255,255,255,.2));transition:color .2s,border-color .2s,transform .2s,background .2s}
.add-row:hover{color:var(--text);border-color:var(--acc);background:rgba(255,255,255,.05)}
.add-row:active{transform:scale(.98)}

/* tab bar: one highlight that glides between tabs */
@media(max-width:899px){
  .tab-pill{position:absolute;left:0;top:50%;width:52px;height:52px;margin-top:-26px;border-radius:50%;pointer-events:none;background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 76%,#fff),var(--acc) 55%,color-mix(in srgb,var(--acc) 84%,#000));box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 8px 22px color-mix(in srgb,var(--acc) 45%,transparent);transition:transform .5s cubic-bezier(.3,1.35,.5,1),opacity .2s;will-change:transform}
  .tab{z-index:1}
  body.glass .tab[aria-current=page],.tab[aria-current=page]{background:none;box-shadow:none;color:var(--on-acc)}
}
@media(min-width:900px){.tab-pill{display:none}}

/* lighter effects = smoother scrolling */
.dock::before{will-change:transform}
body.glass .dock,body.glass .tabbar{backdrop-filter:blur(16px) saturate(1.9) brightness(1.1);-webkit-backdrop-filter:blur(16px) saturate(1.9) brightness(1.1)}
.sidebar{backdrop-filter:none!important}
.track,.card,.pl-row,.feature{backface-visibility:hidden}
html{scroll-behavior:auto}
#view{contain:layout style}


/* v10: cards can never grow because of a long title */
.card{min-width:0;overflow:hidden}
.rail{align-items:flex-start}
.rail .card{flex:0 0 168px;width:168px;max-width:168px}
.cards .card{width:100%}
.card .c-title,.card .c-sub{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile,.feature,.pl-row{min-width:0}

</style>

<script>
(() => {
'use strict';

/* ---------- tiny helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const audio = $('#audio');
const root = document.documentElement;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const hash = s => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; };
const norm = s => String(s || '').toLocaleLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const ico = (n, cls = '') => `<svg class="i ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
/* Running inside the Android app? (the app injects a "WaveNative" bridge) */
const NATIVE = typeof window.WaveNative !== 'undefined';
if (NATIVE) document.body.classList.add('native');
let nativePerm = true;

function time(s) {
  if (!Number.isFinite(s) || s < 0) return '0:00';
  s = Math.floor(s);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}` : `${m}:${String(sec).padStart(2, '0')}`;
}
function longTime(s) {
  const m = Math.round(s / 60);
  if (m < 1) return s > 0 ? 'under a minute' : '';
  if (m < 60) return `${m} min`;
  return `${Math.floor(m / 60)} hr${m % 60 ? ' ' + (m % 60) + ' min' : ''}`;
}
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

/* ---------- state ---------- */
const LS_KEY = 'wave.v8';
let tracks = [];            // {id,name,artist,album,duration,sig,acc,added}
let tmap = new Map();
let playlists = [];         // {id,name,ids:[]}
let liked = [];             // ids, newest first
let likedSet = new Set();
let recent = [];            // ids, newest first
let curId = null;           // current track id (may be loaded lazily)
let loadedId = null;        // id whose file is in the <audio>
let queue = [], base = [], qi = -1;
let shuffle = false, repeat = 'off', sortMode = NATIVE ? 'title' : 'added', volume = 0.8, lastTime = 0;
let view = { name: 'home', id: null }, prevView = null, query = '';
let plays = {}, libTab = 'songs';
let playing = false, seeking = false, dbOk = false, importTarget = null;
const covers = new Map();       // id -> object URL (small jpeg)
const sessionFiles = new Map(); // id -> File imported this session
let curUrl = null, loadToken = 0, errorStreak = 0;
let wantPlay = false, playStartAt = 0, resumeTries = 0;   // used to recover from a pause that nobody asked for
const T = id => tmap.get(id);
const online = new Map();   // songs found online (Deezer / Audius), kept when saved in a playlist or liked
const discover = { search: [], audius: [] };
const reindex = () => { tmap = new Map(); tracks.forEach(t => tmap.set(t.id, t)); online.forEach(t => tmap.set(t.id, t)); likedSet = new Set(liked); };

/* ---------- IndexedDB (songs + covers) ---------- */
const idb = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('no idb'));
      const r = indexedDB.open('wave-music', 1);
      r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('files'); d.createObjectStore('covers'); };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error('blocked'));
    });
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode);
      const out = fn(t.objectStore(store));
      t.oncomplete = () => res(out && 'result' in out ? out.result : undefined);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error || new Error('aborted'));
    });
  },
  put(store, key, val) { return this.tx(store, 'readwrite', s => s.put(val, key)); },
  get(store, key) { return this.tx(store, 'readonly', s => s.get(key)); },
  del(store, key) { return this.tx(store, 'readwrite', s => s.delete(key)); },
  all(store) {
    return new Promise((res, rej) => {
      const out = new Map();
      const t = this.db.transaction(store, 'readonly');
      const req = t.objectStore(store).openCursor();
      req.onsuccess = () => { const c = req.result; if (c) { out.set(c.key, c.value); c.continue(); } };
      t.oncomplete = () => res(out);
      t.onerror = () => rej(t.error);
    });
  }
};

/* ---------- saved settings ---------- */
let saveTimer = null;
function save(now) {
  if (!dbOk) return;
  clearTimeout(saveTimer);
  const run = () => {
    try {
      const ref = new Set([...liked, ...recent]);
      playlists.forEach(p => p.ids.forEach(i => ref.add(i)));
      const remote = Array.from(online.values()).filter(t => ref.has(t.id));
      localStorage.setItem(LS_KEY, JSON.stringify({
        remote,
        tracks: NATIVE ? [] : tracks, plays, playlists, liked, recent, curId, queue, base, qi, shuffle, repeat, sortMode, volume,
        lastTime: Math.floor(lastTime)
      }));
    } catch (e) { /* storage full or blocked */ }
  };
  if (now) run(); else saveTimer = setTimeout(run, 250);
}
function loadSaved() {
  try {
    const s = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (!s) return;
    if (!NATIVE) tracks = Array.isArray(s.tracks) ? s.tracks : [];
    (Array.isArray(s.remote) ? s.remote : []).forEach(t => { if (t && t.id && t.remote) online.set(t.id, t); });
    playlists = Array.isArray(s.playlists) ? s.playlists : [];
    liked = Array.isArray(s.liked) ? s.liked : [];
    recent = Array.isArray(s.recent) ? s.recent : [];
    if (!NATIVE) fixLibrary(tracks);
    reindex();
    const ok = id => NATIVE || tmap.has(id);
    playlists.forEach(p => { p.ids = (p.ids || []).filter(ok); });
    liked = liked.filter(ok); recent = recent.filter(ok);
    reindex();
    curId = tmap.has(s.curId) ? s.curId : null;
    queue = (s.queue || []).filter(id => tmap.has(id)); base = (s.base || []).filter(id => tmap.has(id));
    qi = curId ? queue.indexOf(curId) : -1;
    plays = s.plays && typeof s.plays === 'object' ? s.plays : {};
    shuffle = !!s.shuffle; repeat = ['off', 'all', 'one'].includes(s.repeat) ? s.repeat : 'off';
    sortMode = ['added', 'newest', 'title', 'artist'].includes(s.sortMode) ? s.sortMode : 'added';
    volume = typeof s.volume === 'number' ? clamp(s.volume, 0, 1) : 0.8;
    lastTime = Number(s.lastTime) || 0;
  } catch (e) { /* ignore corrupted state */ }
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg, ms = 2800) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}

/* ---------- reading song details (ID3 tags + cover art) ---------- */
const be32 = (b, o) => ((b[o] << 24) | (b[o + 1] << 16) | (b[o + 2] << 8) | b[o + 3]) >>> 0;
const syncsafe = (b, o) => ((b[o] & 127) << 21) | ((b[o + 1] & 127) << 14) | ((b[o + 2] & 127) << 7) | (b[o + 3] & 127);
const ascii = (b, o, n) => String.fromCharCode(...b.subarray(o, o + n));
function decodeText(d) {
  if (!d.length) return '';
  const enc = d[0]; let bytes = d.subarray(1), label = 'iso-8859-1';
  if (enc === 1) {
    if (bytes[0] === 0xFF && bytes[1] === 0xFE) { label = 'utf-16le'; bytes = bytes.subarray(2); }
    else if (bytes[0] === 0xFE && bytes[1] === 0xFF) { label = 'utf-16be'; bytes = bytes.subarray(2); }
    else label = 'utf-16le';

    try { (await idb.all('covers')).forEach((blob, id) => { if (tmap.has(id)) covers.set(id, URL.createObjectURL(blob)); }); } catch (e) {}
  }
  loadTheme();
  audio.volume = volume; setVolume.last = volume || 0.8;
  syncVolume(); syncModes();
  render(); updateMeta(); syncPlayState(); setupMediaSession(); updateSearchUI();
})();

/* hooks used by the Android app */
window.__waveSync = () => { if (!NATIVE) return; nativeScan(); render(); updateMeta(); };
window.__waveCtl = c => {
  if (c === 'play') { if (!playing) togglePlay(); }
  else if (c === 'pause') { if (playing) togglePlay(); }
  else if (c === 'toggle') togglePlay();
  else if (c === 'next') advance(1, false);
  else if (c === 'prev') prev();
};
window.__waveSeek = s => seekTo(s);
window.__waveBack = () => {
  if (!$('#menu').hidden) { closeMenu(); return true; }
  const d = document.querySelector('dialog[open]'); if (d) { d.close(); return true; }
  if (npOpen) { closeNp(); return true; }
  if (query) { $('#search').value = ''; $('#search').dispatchEvent(new Event('input')); return true; }
  if (navStack.length || view.name !== 'home') { goBack(); return true; }
  return false;
};

})();
